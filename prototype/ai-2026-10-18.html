<script>
const D={"sections": [["coding", "Coding Agents"], ["evals", "AI Evals, Safety & Governance"], ["agenteng", "Agent Engineering & Frameworks"], ["models", "Models & Major Releases"], ["industry", "AI Industry, Policy & Banking"], ["papers", "Papers Worth Reading"], ["repos", "Repos Worth Trying"]], "cards": [{"sec": "coding", "id": "code-review", "h": "Claude Code Review is GA, plus Anthropic's internal review playbook", "t": "Parallel bug-finding agents with a false-positive filter. It never approves, so a person still merges.", "tags": ["Claude Code", "Code review"], "src": ["Blog", "Docs", "X"], "changed": "Out of research preview for Team and Enterprise (9:51am Fri AEDT). Most reviews take 6\u201310 min. Anthropic says Claude writes about 90% of the team's code, and from June to September merged PRs more than doubled while the share reverted fell by more than 40%.", "why": "It's a ready-made design for validating an LLM reviewer: a daily eval built from past incidents, noise measured by how authors respond, a 3-round cap, and an agent's approval never counting as a human one.", "cav": "Reviews run on Anthropic's infrastructure, so check data rules first. @bcherny says it \"catches almost every bug\" (unverified, his own claim).", "links": [["GA announcement", "https://claude.com/resources/articles/code-review-is-now-generally-available"], ["How the team does review", "https://claude.dev/blog/solving-code-review-at-anthropic/"], ["Docs", "https://code.claude.com/docs/en/code-review"], ["@ClaudeDevs", "https://x.com/ClaudeDevs/status/2110866210573386065"], ["@bcherny", "https://x.com/bcherny/status/2111158313463525518"]], "v": "try", "howto": "Enable it on one non-sensitive repo and log every finding as true or false positive for 2 weeks."}, {"sec": "coding", "id": "cc-2-1-302", "h": "Claude Code v2.1.302: headless permission default changes", "t": "claude -p and SDK sessions on Bedrock or Vertex now start in default mode, and the OpenTelemetry fixes have landed.", "tags": ["Claude Code", "Breaking-ish"], "src": ["Changelog", "X"], "changed": "Released 7:53am Sat AEDT. Sessions that set no permission mode start in `default` on a fresh install or with telemetry off. Fork subagents are on by default. `classifier_category` is fixed, and `tool_use_id`/`tool_parameters` are no longer dropped.", "why": "Headless pipelines can change behaviour silently, and your OTel dashboards now get reliable classifier fields.", "cav": "@ClaudeCodeLog is an unofficial bot. The release notes are the authority.", "links": [["Release notes", "https://github.com/anthropics/claude-code/releases/tag/v2.1.302"], ["@ClaudeCodeLog", "https://x.com/ClaudeCodeLog/status/2111203632217559255"]], "v": "try", "howto": "Pin --permission-mode in every CI or headless call, then upgrade."}, {"sec": "coding", "id": "codex-0-163", "h": "Codex CLI 0.163.0: steer mid-turn, and cancelling stops running tools", "t": "New stable release with a live /config panel. Resumed threads keep their approvals.", "tags": ["Codex", "Release"], "src": ["Changelog", "X"], "changed": "Released 8:30am Fri AEDT. You can send follow-ups mid-answer, and interrupting a turn stops Code Mode cells and nested tool calls. Resume restores permissions and network approvals under managed policy. The bundled patched zsh is gone.", "why": "\"Cancel, but the tool keeps running\" and \"resume loses its approvals\" are good agent test cases.", "cav": "@thsottiaux says Codex now gives more usage per plan through subagent context reuse and longer caching (unverified, no changelog entry).", "links": [["Release notes", "https://github.com/openai/codex/releases/tag/rust-v0.163.0"], ["Codex changelog", "https://developers.openai.com/codex/changelog"], ["@thsottiaux on usage", "https://x.com/thsottiaux/status/2111244596131111253"], ["OpenAIDevs: backlog", "https://x.com/OpenAIDevs/status/2111213093577691337"], ["OpenAIDevs: on-call", "https://x.com/OpenAIDevs/status/2111211411766399288"]], "v": "try", "howto": "Search config.toml for the retired shell flags before upgrading."}, {"sec": "coding", "id": "vscode-1-142", "h": "VS Code 1.142: org agent policies can switch off Claude and Codex chat", "t": "With a permissions or sandbox policy set, chat is forced into the Copilot harness.", "tags": ["VS Code", "Enterprise policy"], "src": ["Changelog"], "changed": "Released 14 Oct (US time). Under a non-empty `permissions` policy or `sandbox.enabled: true`, full chat runs in the Copilot harness under Agent Host, and Claude, Codex and terminal chat are unavailable. The opt-out also bypasses the sandbox rules.", "why": "If the bank manages VS Code centrally, this could cut off your daily tools.", "cav": "It only applies when those policies are set.", "links": [["Release notes", "https://code.visualstudio.com/updates/v1_142"]], "v": "monitor", "howto": "Ask your policy owner which VS Code agent policies are set."}, {"sec": "coding", "id": "cursor-canvases", "h": "Cursor: cloud agents build shareable canvases, and the Environments API is in beta", "t": "Agents can produce a dashboard and share it as a link. Environments can now be defined in code.", "tags": ["Cursor", "Cloud agents"], "src": ["X"], "changed": "Announced 7:33am Sat AEDT. The Environments API (beta) manages cloud agent environments in code, including repos and the environment.json setup. Cursor also added Meta's Muse Wonder (46.1% on CursorBench, per Cursor).", "why": "Reproducible sandboxes keep model and harness comparisons fair.", "cav": "Cursor's changelog link returned a 404, so this comes only from its X posts.", "links": [["@cursor_ai canvases", "https://x.com/cursor_ai/status/2111193957527146711"], ["@cursor_ai Environments API", "https://x.com/cursor_ai/status/2111193969355084011"]], "v": "monitor", "howto": "Ask a cloud agent to build a canvas from an eval run."}, {"sec": "coding", "id": "copilot-cli", "h": "Copilot CLI previews fix MCP stalls, and the licence-compliance API is GA", "t": "Hung MCP servers no longer stall sessions, and agents can check dependency licences against policy.", "tags": ["Copilot", "MCP"], "src": ["Changelog"], "changed": "Three pre-releases, the latest at 7:10am Sat AEDT. Reasoning-only token exhaustion now ends with an error instead of looping. `--disable-client-telemetry` added. Open source licence compliance is GA for Enterprise Cloud.", "why": "Both are failure modes worth testing, and the licence API is a cheap deterministic guardrail.", "cav": "These are pre-releases.", "links": [["v1.0.100-0", "https://github.com/github/copilot-cli/releases/tag/v1.0.100-0"], ["Licence compliance GA", "https://github.blog/changelog/2026-10-16-open-source-license-compliance-generally-available"]], "v": "monitor", "howto": "Try --disable-client-telemetry in a preview build."}, {"sec": "coding", "id": "factory", "h": "Factory Delegations is GA, and its docs flag a self-approval gap", "t": "The requester can be the sole approver of the bot's PR. Factory recommends two approvals.", "tags": ["Factory", "Controls"], "src": ["Docs", "X"], "changed": "GA at 3:25am Sat AEDT. Work can be handed to Droid from Slack, Linear and Jira. Because the bot is the PR author, the requester can approve and merge alone.", "why": "Check whether any PR-opening agent at your bank allows requester-only approval.", "cav": "", "links": [["Factory docs", "https://docs.factory.com/delegations"], ["@FactoryAI", "https://x.com/FactoryAI/status/2111131400057602525"]], "v": "monitor", "howto": "Audit branch protection for bot-authored PRs."}, {"sec": "coding", "id": "pi", "h": "Pi: unreleased fix for whitespace-only tool output that 400s every later turn", "t": "One bare \\r\\n tool result could break a whole session on some providers.", "tags": ["Pi", "Robustness"], "src": ["Changelog", "GitHub"], "changed": "On main, not yet released. Whitespace-only results now get the empty-output placeholder, and summaries use the model's full output limit. The durable harness gains per-model compaction thresholds.", "why": "Feed agents empty, whitespace-only and oversized outputs, then check the session recovers.", "cav": "It's unreleased.", "links": [["Changelog", "https://github.com/earendil-works/pi/blob/main/packages/coding-agent/CHANGELOG.md"], ["Fix commit", "https://github.com/earendil-works/pi/commit/4dd2b149"]], "v": "monitor", "howto": "Add whitespace-only tool outputs to your harness tests."}, {"sec": "coding", "id": "opencode", "h": "OpenCode makes GLM 5.3 Flash free and removes session sharing", "t": "Promotional free model access. v1.19.1 drops share links.", "tags": ["OpenCode", "GLM"], "src": ["Changelog", "X"], "changed": "Zhipu's GLM 5.3 Flash is free in OpenCode (about 17k likes). v1.19.2 stops auto-offering OpenCode 2 to 1.x installs.", "why": "Removing sharing closes one way transcripts could leak. Free endpoints suit personal experiments, not bank code.", "cav": "X users claim it's a separate glm-5.3-flash-free model with 200K context (unverified).", "links": [["@opencode", "https://x.com/opencode/status/2110986357539754114"], ["v1.19.1", "https://github.com/anomalyco/opencode/releases/tag/v1.19.1"], ["v1.19.2", "https://github.com/anomalyco/opencode/releases/tag/v1.19.2"]], "v": "monitor", "howto": "Personal projects only."}, {"sec": "coding", "id": "t3code", "h": "T3 Code is out of alpha (unverified)", "t": "Theo's coding tool has left alpha.", "tags": ["T3 Code"], "src": ["X"], "changed": "Announced on X by @theo. He also said npm broke his release.", "why": "It's another agent option to watch next to Claude Code and Codex.", "cav": "It comes only from X, with no release notes reviewed.", "links": [["@theo", "https://x.com/theo/status/2110907433656938681"], ["@theo on npm", "https://x.com/theo/status/2110927196638597251"]], "v": "monitor", "howto": "Wait for release notes."}, {"sec": "evals", "id": "fsb", "h": "FSB final AI report: agent practices for regulated firms", "t": "Judge whether an agent's actions were appropriate, monitor its intermediate steps, and test kill switches.", "tags": ["Regulation", "Agents"], "src": ["Paper"], "changed": "The final text adds agent guidance (Practices 9 and 10): whole-workflow testing, red teaming for higher autonomy, thresholds set in advance, cross-checking agents' own summaries, evaluating AI monitors, and a unique ID for each agent.", "why": "Use it as a gap check. Kill-switch tests and evidence your LLM-judge monitors work are the likely gaps.", "cav": "The FSB says it didn't fully consult on the agent part, so it may change.", "links": [["Final report (PDF)", "https://www.fsb.org/uploads/P151026-1.pdf"], ["Report page", "https://www.fsb.org/2026/10/sound-practices-for-responsible-adoption-of-artificial-intelligence-ai-final-report/"]], "v": "read", "howto": null}, {"sec": "evals", "id": "beam-evals", "h": "Beam's launch: vendor scores vs independent retests, and reward hacking", "t": "Reflection reports 80.1% on Terminal-Bench 2.1, Artificial Analysis measured 3.0% on 4.0, and Gray Swan caught insecure fixes.", "tags": ["Benchmarks", "Reward hacking"], "src": ["Paper", "X"], "changed": "Artificial Analysis gives it 28 on its Coding Agent Index against 68 for the leaders. Gray Swan saw an insecure test-passing fix in 6/44 episodes, a shared registry overwritten in 3/5, and a scope exit in 4/5.", "why": "Build tasks where the honest route is blocked, and score whether the agent stops or escalates.", "cav": "The benchmark versions differ, so the scores aren't directly comparable.", "links": [["Beam safety report", "https://reflection.ai/beam-safety-report"], ["@ArtificialAnlys", "https://x.com/ArtificialAnlys/status/2111087613822296151"]], "v": "read", "howto": null}, {"sec": "evals", "id": "langchain-evals", "h": "LangChain: evals built only from production traces are just regression tests", "t": "Spend more than half of eval time defining what the agent should handle. Prefer narrow pass/fail judges.", "tags": ["Eval design", "LLM-as-judge"], "src": ["Blog", "X"], "changed": "LangChain's FAQ favours pass/fail questions over 1\u201310 scales. In its experiment, the Jev model matched human labels for $0.34 in total, against $28.17 for Sonnet 4.6.", "why": "It's the case for synthetic risk scenarios on top of trace-based regression sets.", "cav": "The cost comparison is LangChain's own experiment.", "links": [["LangChain FAQ", "https://www.langchain.com/blog/common-questions-about-agent-evals"], ["@BraceSproul", "https://x.com/BraceSproul/status/2110854626761388290"]], "v": "read", "howto": null}, {"sec": "evals", "id": "pplx-decider", "h": "Perplexity open-sources calibrated \"decider\" judge models", "t": "27B and 4B Apache-2.0 models that return a probability per fixed option instead of free text.", "tags": ["LLM-as-judge", "Calibration"], "src": ["Paper", "X"], "changed": "pplx-decider-v1.2 scores 68.09 on Perplexity's Decision Index 0.3, up from 62.30. ECE is 0.014 on its dev set but about 0.05 on held-out data.", "why": "A fixed-option judge is easier to calibrate against human labels, and runs on your own hardware.", "cav": "Perplexity now trains on some benchmarks' training splits.", "links": [["Model card", "https://huggingface.co/perplexity-ai/pplx-decider-v1.2"], ["@AravSrinivas", "https://x.com/AravSrinivas/status/2111181956444827695"]], "v": "try", "howto": null}, {"sec": "evals", "id": "braintrust-langsmith", "h": "Braintrust traces coding agents, and LangSmith fixes a pairwise-scoring bug", "t": "Cost and usage per user, model and tool. LangSmith 0.14.9 fixes misattributed pairwise scores.", "tags": ["Observability", "Eval tooling"], "src": ["Changelog", "X"], "changed": "Braintrust's coding-agent insights (preview) trace Claude Code, Codex, pi and Cursor via the bt CLI. In LangSmith, `evaluate_comparative` with `randomize_order` could put scores on the wrong experiment.", "why": "If you ran pairwise judges with random order and several evaluators, re-run the results you relied on.", "cav": "", "links": [["Braintrust changelog", "https://www.braintrust.dev/docs/changelog"], ["LangSmith v0.14.9", "https://github.com/langchain-ai/langsmith-sdk/releases/tag/v0.14.9"]], "v": "monitor", "howto": null}, {"sec": "evals", "id": "phoenix", "h": "Arize Phoenix MCP: SQL trace queries about 17x cheaper (vendor benchmark)", "t": "Code-mode SQL over traces is much cheaper than paging through spans. Works in Claude Code and Cursor.", "tags": ["Observability", "MCP"], "src": ["X"], "changed": "Arize's own benchmark.", "why": "It's a cheaper way to have Claude Code analyse agent traces.", "cav": "It's a vendor-run benchmark from an X post only.", "links": [["@ArizePhoenix", "https://x.com/ArizePhoenix/status/2111028804428947692"]], "v": "monitor", "howto": null}, {"sec": "agenteng", "id": "pydantic", "h": "Pydantic AI 2.57: a second model can pre-approve low-risk tool calls", "t": "ApprovalReviewer fails closed: only a clear \"no risk\" auto-approves, and anything else goes to a person.", "tags": ["Pydantic AI", "Human-in-the-loop"], "src": ["Changelog", "GitHub"], "changed": "Released 2:35pm Fri AEDT. A reviewer model answers one yes/no/unsure risk question you write. It never denies or runs a call.", "why": "It's auto-review as a library primitive. Validate it as a classifier, focusing on \"no risk\" verdicts on risky calls.", "cav": "", "links": [["v2.57.0", "https://github.com/pydantic/pydantic-ai/releases/tag/v2.57.0"], ["PR #10143", "https://github.com/pydantic/pydantic-ai/pull/10143"]], "v": "try", "howto": null}, {"sec": "agenteng", "id": "mastra", "h": "Mastra 1.78: scoped identities, and paused runs survive bad resume data", "t": "Conflicting thread or resource IDs now return a 400 instead of silently picking one.", "tags": ["Mastra", "Multi-tenant"], "src": ["Changelog", "GitHub"], "changed": "Scopes such as org:acme can be set per call, per agent or by middleware. AGENT_RESUME_INVALID_DATA no longer uses up the paused run, and .foreach() failures no longer hang.", "why": "Silent tenant mix-ups are a data-leak risk.", "cav": "", "links": [["core 1.78.0", "https://github.com/mastra-ai/mastra/releases/tag/%40mastra/core%401.78.0"]], "v": "monitor", "howto": null}, {"sec": "agenteng", "id": "trade-republic", "h": "Trade Republic runs live LLM workflows on self-hosted Langfuse (unverified)", "t": "A neobank uses held-out \"train and exam\" datasets to prove an issue is actually fixed.", "tags": ["Bank case study", "Observability"], "src": ["X"], "changed": "Per Langfuse on X. Marc Klingen says the roadmap now focuses on enriching traces so agents can reason over them.", "why": "It's the closest peer example to your work.", "cav": "It comes only from vendor posts on X, with no write-up.", "links": [["@langfuse", "https://x.com/langfuse/status/2110999187399557376"], ["@marcklingen", "https://x.com/marcklingen/status/2111184898216354049"]], "v": "monitor", "howto": null}, {"sec": "agenteng", "id": "deepagents", "h": "Deep Agents 0.7.27: async subagent updates now reach the parent", "t": "Updates arrive as user-role messages, which is a new prompt-injection path.", "tags": ["LangChain", "Subagents"], "src": ["Changelog", "GitHub"], "changed": "The parent checks unfinished subagent tasks before each model call. A finished subagent wakes an idle parent, but never cancels a pending approval. This only works on an Agent Server.", "why": "Add the subagent-to-parent path to your injection tests.", "cav": "", "links": [["0.7.27", "https://github.com/langchain-ai/deepagents/releases/tag/deepagents%3D%3D0.7.27"]], "v": "monitor", "howto": null}, {"sec": "agenteng", "id": "ms-agent-accounts", "h": "Copilot Studio agents get their own accounts and audit trail", "t": "Agents act with their own credentials and scoped permissions, not a borrowed user's.", "tags": ["Microsoft", "Agent identity"], "src": ["Blog"], "changed": "Agents can be @mentioned in Teams and Outlook, carry business-process memory, and start from triggers. It's rolling out through Frontier.", "why": "Agent identity with its own audit trail is what risk teams will ask for.", "cav": "", "links": [["Microsoft blog", "https://www.microsoft.com/en-us/copilot/blog/copilot-studio/delegate-shared-business-processes-to-agents-that-are-more-persistent-and-proactive-with-microsoft-copilot-studio/"]], "v": "monitor", "howto": null}, {"sec": "models", "id": "beam", "h": "Reflection Beam 1.0: a 501B open-weight model under Apache 2.0", "t": "An MoE with 23B active parameters and a 1M context. Runs on-prem via Dell and HPE, with day-one vLLM and Ollama support.", "tags": ["Open weights", "On-prem"], "src": ["Blog", "X", "GitHub"], "changed": "Self-reported: 80.8% on MCP Atlas and 36.1% on Tau3 Banking. The model card allows distillation and fine-tuning. The Mirror harness (Apache 2.0) supports tool-call approval and MCP.", "why": "An Apache licence is easier to clear, but 36.1% on banking tasks means banking flows won't work out of the box.", "cav": "See the independent retest under Evals.", "links": [["Reflection blog", "https://reflection.ai/blog/beam-is-available"], ["Hugging Face", "https://huggingface.co/reflection/Beam-1.0-501B-A23B"], ["Mirror", "https://github.com/reflection-oss/mirror"], ["@NVIDIAAI", "https://x.com/NVIDIAAI/status/2111089696025858212"]], "v": "try", "howto": null}, {"sec": "models", "id": "argon", "h": "Gemini 4 Argon: ARC-verified, and now on AI Pro", "t": "97.5% on ARC-AGI-3 with Google's harness vs 49.8% on the standard one, and access is widening beyond Ultra.", "tags": ["Gemini", "Harness effects"], "src": ["X", "Paper"], "changed": "It scored 91.3% on ARC-AGI-2. It's rolling out to AI Pro in Antigravity and AI Studio. Four Argon agents finished Minecraft in 27 hours.", "why": "The harness is part of the system under test.", "cav": "", "links": [["@arcprize", "https://x.com/arcprize/status/2110768288523251762"], ["@antigravity", "https://x.com/antigravity/status/2110866531932316011"], ["Minecraft paper", "https://arxiv.org/abs/2610.22319"]], "v": "monitor", "howto": null}, {"sec": "models", "id": "astra-pro", "h": "GPT-6 Astra Pro splits tasks across parallel agents you can inspect", "t": "Pro in ChatGPT's Chat tab now runs parallel sub-agents, and each one is reviewable.", "tags": ["OpenAI", "Multi-agent UX"], "src": ["X", "Blog"], "changed": "Announced 7:27am Sat AEDT, with Slides in Spaces too.", "why": "It shows how a lab presents multi-agent traces to non-technical users.", "cav": "", "links": [["@OpenAI", "https://x.com/OpenAI/status/2111192259073094035"], ["Release notes", "https://help.openai.com/en/articles/6825453-chatgpt-release-notes"]], "v": "monitor", "howto": null}, {"sec": "models", "id": "muse-open", "h": "Muse Spark Open: top US open-weights model, but last on agentic evals", "t": "39 on the Artificial Analysis index, but last of the nine top open models on its four agentic evals.", "tags": ["Meta", "Open weights"], "src": ["X", "Blog"], "changed": "It leads open models on AA-Omniscience and uses the fewest output tokens. The licence requires attribution, and model-as-a-service businesses with over $20M revenue need a separate agreement.", "why": "Run your own tool-use suite before using it in agents.", "cav": "Meta posted nothing about it on X in the window.", "links": [["Artificial Analysis", "https://artificialanalysis.ai/models/muse-spark-open"], ["@ArtificialAnlys", "https://x.com/ArtificialAnlys/status/2110893784422908225"]], "v": "monitor", "howto": null}, {"sec": "industry", "id": "banks-block", "h": "US banks block outside AI agents, and the line is settling on read-only MCP", "t": "Schwab blocks \"tens and twenties\" of agents a week. Citi and BofA want human sign-off before money moves.", "tags": ["Banking", "Agent access"], "src": ["News"], "changed": "Schwab will offer MCP servers for balances and research, but not for moving money. Citi bars third-party agents from logging in. Moynihan says money moving out needs human review until the liability rules are clear.", "why": "Expect Australian banks to be asked where they stand.", "cav": "", "links": [["Bloomberg Law", "https://news.bloomberglaw.com/banking-law/us-banks-block-ai-agents-attempting-to-move-money-for-customers"], ["The Next Web", "https://thenextweb.com/news/schwab-blocks-ai-agents-meta-muse"]], "v": "read", "howto": null}, {"sec": "industry", "id": "china-export", "h": "China proposes export controls on frontier models and agents", "t": "23 AI items, including weights above 10^26 FLOPs and agents with 20+ sub-tasks or 200+ tools.", "tags": ["Policy", "China"], "src": ["News"], "changed": "MOFCOM proposed 40 technologies, 23 of them in AI. Already-open models and API access are excluded. Comments close on 15 Nov.", "why": "Future Chinese frontier releases could become conditional to get.", "cav": "", "links": [["MOFCOM", "https://www.mofcom.gov.cn/zcfb/dwmygl/art/2026/art_61446ab4beee4f63973d4d0ab3097648.html"], ["On The Wire", "https://onthewire.ai/article/china-proposes-export-controls-on-23-ai-technologies-from-large-models-to-agents"]], "v": "monitor", "howto": null}, {"sec": "industry", "id": "accc", "h": "Australia: the ACCC warns the AI inquiry about shopping agents", "t": "It's watching agents' built-in brand bias and very granular personalised pricing.", "tags": ["Australia", "Consumer law"], "src": ["News"], "changed": "Told the parliamentary AI inquiry on Friday. Personalised pricing isn't currently illegal. The National Anti-Scam Centre flagged AI voice cloning.", "why": "It's the local version of the banks' agent debate.", "cav": "", "links": [["Canberra Times (AAP)", "https://www.canberratimes.com.au/story/9370183/ai-surveillance-conspiring-bots-on-watchdogs-radar/"]], "v": "monitor", "howto": null}, {"sec": "industry", "id": "anthropic-ipo", "h": "Anthropic IPO: valuation talk eases, and a filing is reportedly due 26 Oct", "t": "Investors discussed about $1.5T, down from about $2T, as growth slowed.", "tags": ["Anthropic", "IPO"], "src": ["News"], "changed": "Q3 was up 45% quarter on quarter. IFR reports an SEC filing on 26 Oct and a mid-November listing.", "why": "The filing will give the first audited numbers.", "cav": "Anthropic hasn't confirmed, and there's no public S-1 yet.", "links": [["Reuters via Investing.com", "https://www.investing.com/news/stock-market-news/exclusiveinvestors-temper-anthropic-ipo-valuation-expectations-over-revenue-growth-slowdown-sources-say-4952698"], ["IFR", "https://www.ifre.com/equities/2499407/anthropic-pushes-ahead-with-mid-november-ipo"]], "v": "monitor", "howto": null}, {"sec": "papers", "id": "fde-gym", "h": "FDE-Gym: can agents deliver for a real customer?", "t": "95 delivery tasks with scripted stakeholders. The best configuration averages 0.56, held back by unstated constraints.", "tags": ["Agent eval", "Benchmark"], "src": ["Paper"], "changed": "Agents are scored on the customer's own metric, with penalties for messages, trial runs and waiting. The best configuration fully resolves only 14 tasks.", "why": "It's a template for ambiguous requests.", "cav": "The results are author-reported.", "links": [["arXiv 2610.22350", "https://arxiv.org/abs/2610.22350"]], "v": "read", "howto": null}, {"sec": "papers", "id": "sweeper", "h": "SWEeper-Bench: can coding agents find bugs nobody reported?", "t": "Codebase plus a vague request only. The best of 15 agents passes 59%.", "tags": ["Coding agents", "Testing"], "src": ["Paper"], "changed": "200 tasks from real fixes, judged by an agentic verifier on what a user would see.", "why": "Agents may never exercise the failing path, so ask for interaction-level tests.", "cav": "", "links": [["arXiv 2610.14096", "https://arxiv.org/abs/2610.14096"]], "v": "read", "howto": null}, {"sec": "papers", "id": "jevharness", "h": "JevAgentHarness: small models for tool-choice decisions", "t": "Accuracy on isolated questions didn't predict end-to-end success. A fitted confidence threshold fixes delegation.", "tags": ["Tool routing", "Cost"], "src": ["Paper"], "changed": "Delegating without a threshold cut success by 19 points. With one, agents were 81\u201389% cheaper and lost under 3 points of success.", "why": "Test tool routing inside full trajectories.", "cav": "", "links": [["arXiv 2610.21412", "https://arxiv.org/abs/2610.21412"]], "v": "read", "howto": null}, {"sec": "papers", "id": "self-evolving", "h": "Self-Evolving Agent Harness: rules for agents rewriting their own scaffolding", "t": "Accept a change only if it holds up on fresh validation data, within a regression budget.", "tags": ["Survey", "Harness"], "src": ["Paper"], "changed": "A 66-page framework covering revisions to prompts, memory, tools and code while the weights stay fixed.", "why": "Gate self-updating AGENTS.md and skills on a held-out set.", "cav": "", "links": [["arXiv 2610.18813", "https://arxiv.org/abs/2610.18813"]], "v": "monitor", "howto": null}, {"sec": "papers", "id": "opengcua", "h": "OpenGCUA: computer-use agents that choose between GUI and code", "t": "+19.6 points on OSWorld-v2 across 8 models, with 53% fewer steps.", "tags": ["Computer use", "Harness"], "src": ["Paper"], "changed": "From Tongyi-MAI. Some Qwen3.8-Max runs used 19.4 times as many reasoning tokens as GPT-6 Astra.", "why": "Results belong to the model plus harness pair, so track token cost.", "cav": "", "links": [["arXiv 2610.22200", "https://arxiv.org/abs/2610.22200"]], "v": "monitor", "howto": null}, {"sec": "papers", "id": "nist-seeds", "h": "Anthropic: Claude traced the NIST curve seeds to lrand48()", "t": "The \"random\" P-curve seeds were lrand48() output seeded with 1997\u201398 timestamps.", "tags": ["Research", "Cryptography"], "src": ["Blog"], "changed": "It brute-forced 17 hidden bits and used LLL to recover the generator state. Valsorda says this rules out a planted weak curve.", "why": "It's agentic research where every claim can be rerun and checked.", "cav": "Anthropic stresses this breaks nothing.", "links": [["Anthropic research", "https://www.anthropic.com/research/ecdsa-curve-origins"], ["Filippo Valsorda", "https://words.filippo.io/seeds-solved/"]], "v": "read", "howto": null}, {"sec": "repos", "id": "plugins-official", "h": "anthropics/claude-plugins-official", "t": "Anthropic's curated Claude Code plugin directory, #1 on GitHub's daily AI trending list (1,552 stars today).", "tags": ["Claude Code", "Plugins"], "src": ["GitHub"], "changed": "An official, curated directory.", "why": "A vetted source eases security review.", "cav": "Review each plugin's permissions.", "links": [["GitHub", "https://github.com/anthropics/claude-plugins-official"]], "v": "try", "howto": null}, {"sec": "repos", "id": "context-mode", "h": "mksglu/context-mode", "t": "An MCP server and hooks that keep raw tool output out of the agent's context (449 stars today).", "tags": ["Context engineering", "MCP"], "src": ["GitHub"], "changed": "Sandboxes tool output and persists session memory.", "why": "It could cut tokens on long Claude Code sessions.", "cav": "Third-party project, maturity unknown.", "links": [["GitHub", "https://github.com/mksglu/context-mode"]], "v": "try", "howto": null}, {"sec": "repos", "id": "android-skills", "h": "android/skills", "t": "Google's official Android Agent Skills, installable as Claude Code or Codex plugins (163 stars today).", "tags": ["Agent Skills", "Google"], "src": ["GitHub"], "changed": "Aimed at areas where evaluations show LLMs underperform.", "why": "It's a reference for how a vendor ships eval-driven skills.", "cav": "", "links": [["GitHub", "https://github.com/android/skills"]], "v": "monitor", "howto": null}, {"sec": "repos", "id": "cursor-plugins", "h": "cursor/plugins", "t": "Cursor's plugin spec and official plugins, including PR-review canvases and a continual-learning plugin (282 stars today).", "tags": ["Cursor", "Plugins"], "src": ["GitHub"], "changed": "The continual-learning plugin updates AGENTS.md.", "why": "Self-updating rules need a held-out gate (see Papers).", "cav": "", "links": [["GitHub", "https://github.com/cursor/plugins"]], "v": "monitor", "howto": null}, {"sec": "repos", "id": "cli-anything", "h": "HKUDS/CLI-Anything", "t": "Wraps existing software in CLIs with SKILL.md files so agents can drive it (323 stars today).", "tags": ["Agent Skills", "CLI"], "src": ["GitHub"], "changed": "A generator plus a community hub.", "why": "It gives agents a cheap way to use legacy tools.", "cav": "Community-built wrappers need review.", "links": [["GitHub", "https://github.com/HKUDS/CLI-Anything"]], "v": "monitor", "howto": null}], "signal": [["code-review", "Claude Code Review is GA, plus how Anthropic validates agent-written code"], ["fsb", "The FSB final report: judge an agent's actions, not just the outcome, and test kill switches"], ["banks-block", "Schwab, Citi and BofA join JPMorgan in blocking outside AI agents"]]};const V={try:"Worth trying",read:"Worth reading",monitor:"Monitor only"};
const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>e(s).replace(/`([^`]+)`/g,"<code>$1</code>");
const cnt=id=>D.cards.filter(c=>c.sec==id).length;let cur="all";
const opts=[["all","All sections"]].concat(D.sections);
document.getElementById('sel').innerHTML=opts.map(([i,n])=>`<option value="${i}">${e(n)} (${i=="all"?D.cards.length:cnt(i)})</option>`).join('');
document.getElementById('side').innerHTML=opts.map(([i,n])=>`<a href="#" data-s="${i}">${e(n)}<b>${i=="all"?D.cards.length:cnt(i)}</b></a>`).join('');
const secName=Object.fromEntries(D.sections);
document.getElementById('sig').innerHTML=D.signal.map(([id,h])=>{const c=D.cards.find(x=>x.id==id);return `<li><a href="#${id}" data-j="${id}">${e(h)}<small>→ ${e(secName[c.sec])}</small></a></li>`}).join('');
function card(c){return `<article class="card" id="${c.id}"><button class="hd" aria-expanded="false"><span class="chev">›</span><h3>${e(c.h)}</h3><p>${md(c.t)}</p><div class="tags">${c.tags.map(t=>`<span class="t">${e(t)}</span>`).join('')}${c.src.map(t=>`<span class="s">${e(t)}</span>`).join('')}<span class="v ${c.v}">${V[c.v]}</span></div></button>
<div class="det"><dl><dt>What changed</dt><dd>${md(c.changed)}</dd><dt>Why it matters to you</dt><dd>${md(c.why)}</dd>${c.cav?`<dt>Caveats</dt><dd>${md(c.cav)}</dd>`:''}${c.howto?`<dt>How to try</dt><dd class="how">${md(c.howto)}</dd>`:''}<dt>Sources</dt><dd class="links">${c.links.map(([n,u])=>`<a href="${e(u)}" target="_blank" rel="noopener">${e(n)} ↗</a>`).join('')}</dd><dt>Verdict</dt><dd><span class="v ${c.v}" style="margin:0">${V[c.v]}</span></dd></dl></div></article>`}
function render(){const ss=cur=="all"?D.sections:D.sections.filter(s=>s[0]==cur);
document.getElementById('list').innerHTML=ss.map(([i,n],k)=>`<h2 class="sec">${k+1+(cur=="all"?0:D.sections.findIndex(s=>s[0]==i))}. ${e(n)} <span>${cnt(i)} items</span></h2>`+D.cards.filter(c=>c.sec==i).map(card).join('')).join('');
document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.s==cur));document.getElementById('sel').value=cur}
function show(s){cur=s;render();scrollTo({top:0})}
document.getElementById('sel').onchange=ev=>show(ev.target.value);
document.getElementById('side').onclick=ev=>{const a=ev.target.closest('a');if(a){ev.preventDefault();show(a.dataset.s)}};
document.getElementById('list').onclick=ev=>{const b=ev.target.closest('button.hd');if(b){const c=b.parentNode;c.classList.toggle('open');b.setAttribute('aria-expanded',c.classList.contains('open'))}};
document.getElementById('sig').onclick=ev=>{const a=ev.target.closest('a');if(!a)return;ev.preventDefault();const c=D.cards.find(x=>x.id==a.dataset.j);cur=c.sec;render();const el=document.getElementById(c.id);el.classList.add('open','flash');scrollTo({top:el.getBoundingClientRect().top+scrollY-document.querySelector('header').offsetHeight-12});setTimeout(()=>el.classList.remove('flash'),1500)};
document.getElementById('share').onclick=async()=>{const d={url:location.href};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);const t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='none',1500)}}catch(_){}};
render();
</script></body></html>
