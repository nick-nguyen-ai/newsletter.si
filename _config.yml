title: SignaLetter
tagline: Signal over noise. The few things that matter today.
description: Signal over noise. The few things that matter today.
url: "https://signaletter.si"
baseurl: ""
lang: en
# Issues publish ~08:25 Australia/Sydney; Actions/Pages builds run in UTC.
# Without these, same-day posts can look "future" and be skipped.
timezone: Australia/Sydney
future: true

markdown: kramdown
highlighter: rouge
# Per-section URL from filename slug, e.g. .../markets/ or .../ai/
permalink: /:year/:month/:day/:slug/

# "My shares" (per-reader watchlist). Leave unset until the Cloudflare Worker is deployed:
# while unset, no sign-in link, script or styles are added and pages render as before.
# watchlist_api: https://signaletter-api.<your-subdomain>.workers.dev

# GitHub Pages–supported plugins only
plugins:
  - jekyll-feed
  - jekyll-seo-tag

include:
  - CNAME
  - site.webmanifest
  - manifest.webmanifest

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - vendor
  - .gitignore
  - scripts
  - worker
  - node_modules

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: day
