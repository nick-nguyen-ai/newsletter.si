title: newsletter.si
tagline: Daily ASX & global markets briefing, plus a daily AI report
description: Daily ASX & global markets briefing, plus a daily AI report
url: "https://nick-nguyen-ai.github.io"
baseurl: "/newsletter.si"
lang: en
# Issues publish ~08:25 Australia/Sydney; Actions/Pages builds run in UTC.
# Without these, same-day posts can look "future" and be skipped.
timezone: Australia/Sydney
future: true

markdown: kramdown
highlighter: rouge
# Per-section URL from filename slug, e.g. .../markets/ or .../ai/
permalink: /:year/:month/:day/:slug/

# GitHub Pages–supported plugins only
plugins:
  - jekyll-feed
  - jekyll-seo-tag

include:
  - manifest.webmanifest

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - vendor
  - .gitignore
  - scripts

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: day
