<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="newsletter.si mark">
  <title>newsletter.si - Option C mark</title>
  <!-- Signal/chart line forming a restrained n silhouette -->
  <rect width="64" height="64" rx="10" fill="#0b1c2c"/>
  <!-- soft baseline -->
  <line x1="12" y1="48" x2="52" y2="48" stroke="#1e3a4c" stroke-width="1.5"/>
  <!-- rising signal that reads as n: stem, arch, stem -->
  <path d="M16 46 V24 L16 24 C16 24 18 18 26 18 C34 18 36 28 36 28 L36 46"
        fill="none" stroke="#f5f2ea" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 32 C40 20 48 18 50 18"
        fill="none" stroke="#0d6e6e" stroke-width="3.2" stroke-linecap="round"/>
  <!-- small terminal dot / data point -->
  <circle cx="50" cy="18" r="2.6" fill="#c4a574"/>
</svg>
