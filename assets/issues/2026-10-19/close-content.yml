- id: still-open
  cards:
  - id: handoff
    headline: 'Still open: Hormuz, NextDC, Challenger, BHP and RBA speakers'
    takeaway: Stories that haven't settled, for tomorrow morning's briefing to pick up.
    tags: [handoff, Iran, ASX]
    what_happened: >-
      **Hormuz.** Iran's Revolutionary Guard navy said early Monday that an oil tanker it described as using an unauthorised route hit a mine south of the strait, causing an engine-room fire
      ([Xinhua](https://english.news.cn/20261019/07542a744f7d4ffb882d9e84b114462d/c.html)). That hasn't been independently confirmed
      ([Gulf News](https://gulfnews.com/world/mena/us-israel-iran-war-hormuz-deal-unresolved-us-renews-warning-to-americans-1.500715439)). Foreign Minister Araghchi said Iran's conditional
      seven-day reopening proposal was "still on the table" and that Iran was reviewing US comments, but no agreement has been confirmed (Gulf News).
      US Central Command said its blockade of Iranian ports "is professionally communicated to all international mariners". The IMO's Secretary-General said about
      6,000 seafarers remain trapped and advised ships not to transit until there are guarantees
      ([Fox News](https://www.foxnews.com/world/strait-hormuz-crisis-traps-6000-sailors-attacks-ships-mount-un-maritime-chief-says)).
      **ASX.** NextDC's update on the M3 delay is due by Wednesday's open. Challenger's board is still considering the TAL Dai-ichi proposal.
      BHP's September-quarter operational review is due at about 8:30am on Tuesday ([BHP](https://www.bhp.com/investor-centre/financial-calendar)).
      **RBA.** Ellis Connolly speaks at 9:50am Tuesday and Deputy Governor Hauser at 8:45am Wednesday ([RBA](https://www.rba.gov.au/coming-up/)).
    why_it_matters: >-
      Hormuz shipping is the main driver of the oil price, and oil feeds directly into the RBA's inflation assessment. The company updates could move individual ASX stocks at Tuesday's open.
    sources:
    - {label: Xinhua (IRGC statement), url: 'https://english.news.cn/20261019/07542a744f7d4ffb882d9e84b114462d/c.html', claim_type: official_statement, perspective: Iranian state media, date: '2026-10-19'}
    - {label: Gulf News, url: 'https://gulfnews.com/world/mena/us-israel-iran-war-hormuz-deal-unresolved-us-renews-warning-to-americans-1.500715439', claim_type: reporting, perspective: Gulf regional, date: '2026-10-19'}
