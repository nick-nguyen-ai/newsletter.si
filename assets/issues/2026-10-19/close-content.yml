- id: rates-fx
  cards:
  - id: kent-rba-aud
    headline: Kent asks whether policy is "restrictive enough"; hike odds edge up
    takeaway: Futures put the chance of a 3 November hike at about 22%, up from 18% on Friday, and the dollar rose to about 69.7 US cents.
    tags: [RBA, rates, AUD]
    key_figure: AUD/USD 0.6978 (18:22 AEDT)
    what_happened: >-
      RBA Assistant Governor Christopher Kent said the main channels of monetary policy were still working. He said the cash rate and its expected path sit towards
      the upper end of the RBA's neutral-rate estimates: "That tells you that you have some confidence that monetary policy is somewhat restrictive. But the question
      is: is it restrictive enough?" He said some indicators suggest the labour market has loosened faster than the RBA forecast, and that the RBA would weigh this
      against the upcoming inflation data ([CommBank Newsroom](https://www.commbank.com.au/articles/newsroom/2026/10/is-monetary-policy-still-working-rba-chris-kent.html),
      [RBA transcript](https://www.rba.gov.au/speeches/2026/sp-ag-2026-10-19.html)).
      ASX 30-day interbank futures at Monday's close implied about a 22% chance of a 25 bp hike on 3 November, up from 18% at Friday's close
      ([RBA Watch](https://rbawatch.com/rba-meeting/november-2026)). The Australian dollar was at 69.73 US cents after the close, up from 69.42 at 5pm on Friday
      ([AAP](https://aapnews.aap.com.au/news/asx-edges-higher-as-financials-and-energy-stocks-lift)).
    why_it_matters: >-
      Markets still expect a hold, but the hike odds have risen. Kent pointed to the upcoming inflation data as the next major input before the RBA decision.
    competing_views:
    - who: Joseph Marassa, Global X
      view: '"With oil prices persistently high and the risk of higher inflation, markets may be underpricing the chance the RBA acts again."'
      source: {label: AAP, url: 'https://aapnews.aap.com.au/news/asx-edges-higher-as-financials-and-energy-stocks-lift', claim_type: forecast, date: '2026-10-19'}
    - who: Barclays FX strategy
      view: Remains bullish on the Australian dollar, saying a positive commodity shock affects the RBA and the AUD "2–3 times as much" as housing headwinds.
      source: {label: ABC markets blog, url: 'https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976', claim_type: forecast, date: '2026-10-19'}
    comparison:
