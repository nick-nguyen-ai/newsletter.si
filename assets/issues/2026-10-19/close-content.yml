  - id: asx-movers
    headline: Takeovers lift Cleanaway and Challenger; Mesoblast and Weebit fall
    takeaway: Cleanaway rose 20.2% and Challenger about 19%. Mesoblast fell 11.1%, and NextDC was in a trading halt.
    tags: [ASX, M&A, movers]
    what_happened: >-
      **Cleanaway (CWY) +20.2%.** The company signed a binding scheme deed with EQT Infrastructure at A$3.095 cash a share, less any dividends paid before completion.
      Its board unanimously recommends the deal, subject to no superior proposal and an independent expert's opinion. The deal needs approval from FIRB, the ACCC
      and Kuwaiti and Saudi regulators, and it has no financing condition
      ([Cleanaway ASX release](https://announcements.asx.com.au/asxpdf/20261019/pdf/075gv9tvfhp3dx.pdf)). EQT expects to complete it by the end of March 2027
      ([EQT](https://eqtgroup.com/news/eqt-agrees-to-acquire-cleanaway-a-leading-australian-integrated-waste-management-and-resource-recovery-platform-2026-10-18)).
      The deal values Cleanaway at about A$9.3 billion including debt ([Market Index](https://www.marketindex.com.au/news/asx-200-live-today-monday-19th-october)).
      **Challenger (CGF) about +19%, to A$11.75.** TAL Dai-ichi Life Australia, which owns 20.4%, proposed a non-binding A$11.80 a share for the rest.
      The proposal depends on due diligence, a binding agreement, regulatory approvals and the board's support, and the board is considering it
      ([Challenger ASX release](https://announcements.asx.com.au/asxpdf/20261019/pdf/075gfqdsp2yzqs.pdf), [ABC](https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976),
      [Stockhead](https://stockhead.com.au/news/closing-bell-asx-edges-higher-on-rubbish-coal-and-takeover-fever/)).
      **New Hope (NHC)** agreed to buy the 74% of Malabar Resources it doesn't already own in an all-scrip deal that values Malabar at about A$1.8 billion
      ([Market Index](https://www.marketindex.com.au/news/asx-200-live-today-monday-19th-october)).
      **Fallers:** Mesoblast fell 11.1% after broker downgrades and was the ASX 200's worst performer. Weebit Nano fell about 7.6%, and Stockland and Bendigo Bank each fell about 4% after their quarterly updates
      ([ABC](https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976)). Bendigo's net interest margin fell 6 bp to 1.94%
      ([Market Index](https://www.marketindex.com.au/news/asx-200-live-today-monday-19th-october)).
      **NextDC (NXT)** is in a trading halt while it assesses a power-supply delay at its M3 Melbourne data centre, including the effect on FY27 guidance.
      The halt lasts until it makes an announcement or until trading opens on Wednesday 21 October, whichever comes first
      ([Market Index](https://www.marketindex.com.au/news/asx-200-live-today-monday-19th-october)).
    why_it_matters: >-
      Takeovers accounted for much of the index's gain. The Cleanaway deal is now binding, while the Challenger proposal is not, so Challenger's price still
      depends on whether TAL Dai-ichi makes a binding offer. The NextDC update could matter for other ASX data-centre stocks that are already under pressure from the US AI-debt selloff.
    what_to_watch: The NextDC announcement by Wednesday's open, and any response from the Challenger board.
    sources:
    - {label: Cleanaway ASX release (SID with EQT), url: 'https://announcements.asx.com.au/asxpdf/20261019/pdf/075gv9tvfhp3dx.pdf', claim_type: official_statement, date: '2026-10-19'}
