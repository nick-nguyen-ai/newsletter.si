- id: asx-close
  cards:
  - id: asx200-close
    headline: ASX 200 up 0.4% as energy and banks offset tech
    takeaway: The index closed at 8,845.7, its second straight gain, while small caps and tech fell.
    tags: [ASX, sectors]
    key_figure: 8,845.7 · +0.44% (19 Oct close)
    what_happened: >-
      The S&P/ASX 200 rose 39 points, or 0.44%, to 8,845.7, and the All Ordinaries gained 0.39% to 8,975.7
      ([AAP](https://aapnews.aap.com.au/news/asx-edges-higher-as-financials-and-energy-stocks-lift)).
      Seven of the 11 sectors finished higher ([AFR](https://www.afr.com/markets/equity-markets/asx-to-fall-as-ai-trade-faces-earnings-test-20261019-p616gw)).
      Energy led with a 2.21% gain, followed by financials (+0.86%) and industrials (+0.83%). Tech fell 1.31%, consumer discretionary 0.20%,
      real estate 0.19% and staples 0.08%. The Small Ordinaries fell 0.35% and gold miners 0.68%
      ([Stockhead, citing Market Index](https://stockhead.com.au/news/closing-bell-asx-edges-higher-on-rubbish-coal-and-takeover-fever/)).
      Coal miners drove the energy gain, with most of the major ones, including Whitehaven, up 5% to 6%. The big four banks all rose, and BHP gained 0.7%
      ([ABC](https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976)).
    why_it_matters: >-
      Friday's Nasdaq fall of 2.1% hit Australian tech, but the index's heavy weighting to banks, energy and miners
      kept it higher overall. That gap could narrow or widen depending on how US tech trades tonight.
    competing_views:
    - who: Chris Weston, Pepperstone
      view: '"Australia is a low-beta, more defensive value market," which helped on a day when AI-linked stocks were "called into question".'
      source: {label: AAP, url: 'https://aapnews.aap.com.au/news/asx-edges-higher-as-financials-and-energy-stocks-lift', claim_type: opinion, date: '2026-10-19'}
    chart:
      type: bar
      label: ASX 200 sector moves, 19 Oct (%)
      labels: [Energy, Financials, Industrials, Staples, Real estate, Discretionary, Tech]
      values: [2.21, 0.86, 0.83, -0.08, -0.19, -0.20, -1.31]
      unit: '%'
      caption: Sectors with a published figure only. Utilities, telcos, healthcare and materials also rose, but no figure was published.
      source: Market Index via Stockhead
