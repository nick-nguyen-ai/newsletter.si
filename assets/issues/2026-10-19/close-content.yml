- id: commodities
  cards:
  - id: commodities-board
    headline: Brent eases from near US$110; coal and copper firmer
    takeaway: Brent futures were about 2% lower during the Asian session, and gold and copper futures were higher.
    tags: [oil, gold, copper, coal]
    key_figure: Brent 107.27 · −2.4% (19 Oct, vs Friday settle)
    what_happened: >-
      In the latest Yahoo daily bars (retrieved 6:23pm Sydney time), Brent futures were at US$107.27, 2.4% below Friday's settlement of US$109.86. Gold futures were up 0.6% at US$4,205.0, and COMEX copper futures were up 1.2% at US$6.609 a pound
      (close snapshot, [Yahoo Finance](https://finance.yahoo.com/quote/BZ%3DF/)). Spot gold was near US$4,176 an ounce
      ([AAP](https://aapnews.aap.com.au/news/asx-edges-higher-as-financials-and-energy-stocks-lift)). Newcastle coal futures rose 1.1% to US$154.60 a tonne on Friday, and
      Chinese coal output fell 6.8% from a year earlier in September ([Market Index](https://www.marketindex.com.au/news/asx-200-live-today-monday-19th-october)).
      The iron ore tile shows Friday's figure because no same-day print was available.
    why_it_matters: >-
      Oil remains the main input to the inflation and RBA debate. Coal prices and Chinese supply shortfalls lifted ASX coal miners today.
    competing_views:
    - who: TradingView News
      view: Linked the oil fall to prospects for more Russian fuel exports after the US sanctions waiver, while noting that attacks around Hormuz leave supply vulnerable.
      source: {label: TradingView News, url: 'https://www.tradingview.com/news/tradingview:29d3a0f9c094b:0-nasdaq-futures-rebound-1-as-oil-falls-and-tech-earnings-loom-what-to-watch-this-week/', claim_type: opinion, date: '2026-10-19'}
    comparison:
