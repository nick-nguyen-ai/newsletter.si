# Close editorial for 2026-10-19 (after the close). Dashboard figures come from
# close-snapshot.json (fetch_markets.py --close, retrieved 2026-10-19 07:23Z).
session_note: Weekday ASX edition · after the close
summary:
- 'The ASX 200 rose 0.44% to 8,845.7, with 7 of 11 sectors higher. Energy led (+2.2%) and tech fell most (−1.3%) ([AAP](https://aapnews.aap.com.au/news/asx-edges-higher-as-financials-and-energy-stocks-lift), [Stockhead/Market Index](https://stockhead.com.au/news/closing-bell-asx-edges-higher-on-rubbish-coal-and-takeover-fever/)).'
- 'Two takeover deals drove the biggest gains. Cleanaway rose about 20% after agreeing a binding A$3.095 cash deal with EQT, and Challenger rose about 19% on a non-binding A$11.80 a share proposal from TAL Dai-ichi Life ([Cleanaway ASX release](https://announcements.asx.com.au/asxpdf/20261019/pdf/075gv9tvfhp3dx.pdf), [ABC](https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976)).'
- 'China''s economy grew 4.5% a year in the September quarter, against a 4.4% forecast. US share futures were higher at 4pm Sydney time, ahead of tonight''s US session, which starts at 12:30am Tuesday ([NBS](https://www.stats.gov.cn/english/PressRelease/202610/t20261019_1965619.html), [ABC](https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976)).'
