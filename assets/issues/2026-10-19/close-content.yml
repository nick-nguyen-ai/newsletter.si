  - id: china-q3-gdp
    headline: China grew 4.5% in the September quarter, above forecasts
    takeaway: Growth beat the 4.4% consensus and picked up from 4.3%, but investment and property kept falling.
    tags: [China, macro, iron ore]
    key_figure: GDP +4.5% y/y (Q3 2026)
    what_happened: >-
      China's GDP grew 4.5% from a year earlier in the September quarter, up from 4.3% in the June quarter, and 1.2% from the previous quarter.
      Growth for the first nine months was 4.6% ([NBS](https://www.stats.gov.cn/english/PressRelease/202610/t20261019_1965619.html)).
      The consensus forecast was 4.4%. In September, retail sales rose 1.1% and industrial output 5.5%. Fixed-asset investment fell 7.2% and property investment 20.6% over the first nine months
      ([ABC/Reuters](https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976), [Market Index](https://www.marketindex.com.au/news/asx-200-live-today-monday-19th-october)).
      Beijing's 2026 growth target is 4.5% to 5%.
    why_it_matters: >-
      China buys most of Australia's iron ore and coal. Strong factory output supports demand for those commodities, while the property slump, the biggest
      source of steel demand, has not improved. Iron ore futures rose above US$91 a tonne after the data, and miners recovered from an early fall
      ([AAP](https://aapnews.aap.com.au/news/asx-edges-higher-as-financials-and-energy-stocks-lift)).
    competing_views:
    - who: Mao Shengyong, NBS deputy head
      view: Growth of 4.6% over the first three quarters is in line with the annual target, and new growth drivers contributed more than 40% of growth.
      source: {label: Xinhua via gov.cn, url: 'https://english.www.gov.cn/archive/statistics/202610/19/content_WS6ad5a59bc6d00ca5f9a0dc86.html', claim_type: official_statement, date: '2026-10-19'}
    - who: Raymond Yeung, ANZ
      view: '"Growth has stabilised, but it has not yet entered a self-sustaining recovery," with weak domestic demand and the property downturn holding activity back.'
      source: {label: ABC markets blog, url: 'https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976', claim_type: forecast, date: '2026-10-19'}
    sources:
    - {label: National Bureau of Statistics, url: 'https://www.stats.gov.cn/english/PressRelease/202610/t20261019_1965619.html', claim_type: official_statement, date: '2026-10-19'}
    - {label: Xinhua via gov.cn, url: 'https://english.www.gov.cn/archive/statistics/202610/19/content_WS6ad5a59bc6d00ca5f9a0dc86.html', claim_type: reporting, date: '2026-10-19'}
    - {label: ABC markets blog (with Reuters), url: 'https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976', claim_type: reporting, date: '2026-10-19'}
