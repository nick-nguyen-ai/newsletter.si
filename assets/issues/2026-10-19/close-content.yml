- id: tonight
  cards:
  - id: overnight-setup
    headline: US futures point higher before a light Monday data calendar
    takeaway: At 4pm Sydney time, S&P 500 futures were up 0.8% and Nasdaq futures 1.3%. Big-tech results come later in the week.
    tags: [overnight, US, Europe]
    what_happened: >-
      At 4pm Sydney time, S&P 500 futures were up 0.8%, Dow futures 0.5% and Nasdaq futures 1.3%
      ([ABC](https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976)). Earlier in the Asian session, Euro Stoxx 50 futures were about 0.3% lower
      ([TradingView News](https://www.tradingview.com/news/tradingview:29d3a0f9c094b:0-nasdaq-futures-rebound-1-as-oil-falls-and-tech-earnings-loom-what-to-watch-this-week/)).
      European cash markets open at 6pm Sydney time and US markets at 12:30am Tuesday. The only scheduled US data tonight is the NAHB homebuilder index at 1am Tuesday (September: 32)
      ([NAHB](https://www.nahb.org/news-and-economics/housing-economics/indices/housing-market-index)). Netflix reports on Tuesday US time, and Meta and Tesla on Wednesday US time
      ([TradingView News](https://www.tradingview.com/news/tradingview:29d3a0f9c094b:0-nasdaq-futures-rebound-1-as-oil-falls-and-tech-earnings-loom-what-to-watch-this-week/)).
    why_it_matters: >-
      Futures don't guarantee where the cash session will finish. After the Philadelphia chip index's eighth straight daily fall on Friday
      ([Market Index](https://www.marketindex.com.au/news/asx-200-live-today-monday-19th-october)), tonight's chip and AI-credit moves will set up Tuesday's open for ASX tech and data-centre stocks.
    sources:
