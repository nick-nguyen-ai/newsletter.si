  cards:
  - id: asia-board
    headline: KOSPI recovers from early fall; Nikkei lower, Shanghai higher
    takeaway: Korea rose 1.8% after opening down 3.2%, Japan fell 0.6%, China rose 0.4%, and Hong Kong was closed.
    tags: [Asia]
    key_figure: KOSPI 5,768.0 · +1.8% (19 Oct close)
    what_happened: >-
      The KOSPI opened down 3.17% but closed up 1.76% at 5,768.01, after a low of 5,488.41. Institutions bought a net 574.66 billion won of shares,
      while foreign and retail investors were net sellers ([Yonhap](https://en.yna.co.kr/view/AEN20261019007000320)).
      The Nikkei 225 fell 407.59 points to 64,916.70 ([Nikkei](https://www.nikkei.com/article/DGXZQOFL190CX0Z11C26A0000000/),
      [Yahoo Finance](https://finance.yahoo.com/quote/%5EN225/history/)). The Shanghai Composite rose 0.39%
      ([Yicai](https://www.yicai.com/news/103398908.html)). Hong Kong's market and Stock Connect were closed for the Chung Yeung Festival holiday
      ([Luk Fook Financial notice](https://lff.com.hk/en/news/2026chungyeung/)).
    why_it_matters: >-
      Korea's market is heavily tied to memory makers Samsung and SK Hynix, which are down more than 50% from their June highs
      ([Market Index](https://www.marketindex.com.au/news/asx-200-live-today-monday-19th-october)). The KOSPI fell almost 15% last week
      ([ABC](https://www.abc.net.au/news/2026-10-19/asx-markets-business-live-news/107280976)), so today's recovery is an early read on AI-linked stocks before the US opens.
    competing_views:
    - who: IBK Securities
      view: Some investors appeared to buy large caps "in search of bargains" after sharp recent falls, despite reservations about AI infrastructure spending.
      source: {label: Yonhap, url: 'https://en.yna.co.kr/view/AEN20261019007000320', claim_type: opinion, date: '2026-10-19'}
    sources:
